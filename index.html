<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>関根商店 神経衰弱</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { width:100%; height:100%;
    background:
      radial-gradient(circle at 50% 30%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(circle at 50% 100%, #b8791f 0%, #8a5a15 55%, #5c3a0d 100%),
      linear-gradient(135deg, #f4d879, #d9a441 40%, #a5691e 100%);
    background-blend-mode: screen, normal, normal;
    font-family:'Hiragino Sans','Yu Gothic',sans-serif; overflow:hidden; }
  #app { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; }

  /* ---------- ヘッダー ---------- */
  #topbar { width:100%; display:flex; justify-content:space-between; align-items:center; padding:8px 10px; color:#3a2410; font-weight:bold; font-size:13px; z-index:5; gap:4px; text-shadow:0 1px 2px rgba(255,255,255,0.4); }
  #topbar span.label { opacity:0.75; font-size:10px; display:block; }
  #topbar > div { text-align:center; }

  /* ---------- ボード ---------- */
  #boardWrap { flex:1; width:100%; display:flex; align-items:center; justify-content:center; overflow:auto; padding:8px; }
  #board { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; max-width:640px; width:100%; }

  .cardSlot { aspect-ratio: 5 / 7; perspective:800px; }
  .cardInner { position:relative; width:100%; height:100%; transition:transform 0.45s; transform-style:preserve-3d; }
  .cardSlot.flipped .cardInner { transform:rotateY(180deg); }
  .cardFace { position:absolute; inset:0; backface-visibility:hidden; border-radius:8%; overflow:hidden; box-shadow:0 3px 10px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,213,79,0.55); }
  .cardFace img { width:100%; height:100%; object-fit:cover; display:block; }
  .cardBack { }
  .cardFront { transform:rotateY(180deg); }
  .cardSlot.matched .cardInner { opacity:0.7; }

  .cardSlot.spin-effect { animation: slotSpin 0.9s ease-in-out; z-index:3; }
  @keyframes slotSpin {
    0% { transform:rotate(0deg) scale(1); }
    50% { transform:rotate(360deg) scale(1.18); }
    100% { transform:rotate(720deg) scale(1); }
  }

  .cardSlot.shuffle-wiggle { animation: wiggle 0.45s ease-in-out; }
  @keyframes wiggle {
    0%,100% { transform:translateX(0) rotate(0deg); }
    25% { transform:translateX(-6px) rotate(-4deg); }
    75% { transform:translateX(6px) rotate(4deg); }
  }

  .cardSlot.choice-glow { animation: choicePulse 0.8s ease-in-out infinite, choiceBounce 0.6s ease-in-out infinite; z-index:6; position:relative; }
  @keyframes choicePulse {
    0%,100% { box-shadow:0 0 0 0 rgba(255,213,79,1), 0 0 20px 6px rgba(255,213,79,0.6); filter:brightness(1); }
    50% { box-shadow:0 0 0 16px rgba(255,213,79,0), 0 0 40px 14px rgba(255,213,79,0.9); filter:brightness(1.4); }
  }
  @keyframes choiceBounce {
    0%,100% { transform:translateY(0) scale(1.05); }
    50% { transform:translateY(-8px) scale(1.1); }
  }
  .cardSlot.choice-glow::after {
    content:'👉'; position:absolute; left:50%; top:-38px; transform:translateX(-50%);
    font-size:28px; animation: pointerBob 0.6s ease-in-out infinite; z-index:7;
  }
  @keyframes pointerBob { 0%,100%{ transform:translateX(-50%) translateY(0); } 50%{ transform:translateX(-50%) translateY(6px); } }
  #boardDim { position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:5; opacity:0; pointer-events:none; transition:opacity 0.3s ease; }
  #boardDim.on { opacity:1; }

  #choicePrompt {
    position:fixed; top:44px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:linear-gradient(180deg,#ffe082,#ffb300); color:#3a2400; font-weight:bold;
    font-size:13px; padding:8px 16px; border-radius:20px; border:2px solid #a86a00;
    box-shadow:0 4px 14px rgba(0,0,0,0.5); z-index:23; opacity:0; pointer-events:none;
    transition: opacity 0.3s ease, transform 0.3s ease; white-space:nowrap;
  }
  #choicePrompt.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .cardSlot.matched { animation: matchPop 0.5s ease; z-index:2; }
  .cardSlot.gone { transition: opacity 0.6s ease, transform 0.6s ease; opacity:0; transform:scale(0.7); pointer-events:none; }
  @keyframes matchPop {
    0%{ transform:scale(1) rotate(0deg); filter:brightness(1); }
    30%{ transform:scale(1.25) rotate(-6deg); filter:brightness(1.6) drop-shadow(0 0 18px #ffd54f); }
    60%{ transform:scale(1.1) rotate(4deg); filter:brightness(1.3) drop-shadow(0 0 12px #ffd54f); }
    100%{ transform:scale(1) rotate(0deg); filter:brightness(1); }
  }

  #luckyLayer { position:fixed; inset:0; pointer-events:none; z-index:20; display:flex; align-items:center; justify-content:center; }
  .lucky-text {
    position:absolute;
    font-family:'Courier New',monospace;
    font-weight:900;
    font-size:15vw;
    background:linear-gradient(100deg, #fff6cf, #ffd54f 25%, #fff6cf 50%, #ffb300 75%, #fff6cf 100%);
    background-size:220% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:3px #8a3d00;
    filter:drop-shadow(0 0 22px #ffd54f) drop-shadow(0 0 46px #ff6f00);
    letter-spacing:2px;
    white-space:nowrap;
    animation: luckyPop 0.9s cubic-bezier(.2,1.4,.4,1) forwards, luckyShine 0.9s linear;
  }
  @keyframes luckyShine { 0%{ background-position:0% center; } 100%{ background-position:-220% center; } }
  .lucky-rays {
    position:absolute; width:70vmax; height:70vmax; pointer-events:none;
    background:repeating-conic-gradient(rgba(255,213,79,0.35) 0deg 4deg, transparent 4deg 16deg);
    border-radius:50%;
    animation: raysSpin 1.1s linear forwards, raysFade 1.1s ease-out forwards;
  }
  @keyframes raysSpin { from{ transform:translate(-50%,-50%) rotate(0deg); } to{ transform:translate(-50%,-50%) rotate(80deg); } }
  @keyframes raysFade { 0%{ opacity:0.9; } 100%{ opacity:0; } }
  @keyframes luckyPop {
    0% { transform:scale(0.2) rotate(-15deg); opacity:0; }
    30% { transform:scale(1.3) rotate(6deg); opacity:1; }
    55% { transform:scale(1) rotate(-3deg); opacity:1; }
    80% { transform:scale(1.05) rotate(0deg); opacity:1; }
    100% { transform:scale(1.15) rotate(0deg); opacity:0; }
  }

  .sparkle-burst { position:fixed; width:10px; height:10px; pointer-events:none; z-index:19; }

  #matchFlash { position:fixed; inset:0; background:#fff9c4; opacity:0; pointer-events:none; z-index:18; }
  #matchFlash.flash { animation: matchFlashAnim 0.35s ease-out; }
  @keyframes matchFlashAnim { 0%{opacity:0.75;} 100%{opacity:0;} }

  .sad-text {
    position:absolute;
    font-family:'Courier New',monospace;
    font-weight:900;
    font-size:12vw;
    color:#90a4ae;
    -webkit-text-stroke:2px #263238;
    text-shadow:0 0 20px rgba(0,0,0,0.6);
    white-space:nowrap;
    animation: sadDroop 1.1s ease-in forwards;
  }
  @keyframes sadDroop {
    0% { transform:translate(-50%,-50%) scale(1.3) rotate(0deg); opacity:1; filter:grayscale(0); }
    50% { transform:translate(-50%,-30%) scale(1.05) rotate(4deg); opacity:1; filter:grayscale(0.6); }
    100% { transform:translate(-50%,40%) scale(0.85) rotate(8deg); opacity:0; filter:grayscale(1); }
  }
  .joker-shake { animation: jokerShake 0.6s cubic-bezier(.36,.07,.19,.97) 3; }
  @keyframes jokerShake {
    0%,100% { transform:translate(0,0); }
    10% { transform:translate(-10px,-4px) rotate(-1.5deg); }
    20% { transform:translate(12px,3px) rotate(1.5deg); }
    30% { transform:translate(-14px,2px) rotate(-2deg); }
    40% { transform:translate(14px,-3px) rotate(2deg); }
    50% { transform:translate(-10px,4px) rotate(-1deg); }
    60% { transform:translate(10px,-2px) rotate(1deg); }
    70% { transform:translate(-8px,2px) rotate(-1deg); }
    80% { transform:translate(8px,-2px) rotate(1deg); }
    90% { transform:translate(-4px,1px) rotate(0deg); }
  }
  .joker-text {
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%);
    font-family:'Courier New',monospace; font-weight:900;
    font-size:17vw; color:#ff1744;
    -webkit-text-stroke:4px #1a0000;
    text-shadow:0 0 40px rgba(255,23,68,0.9), 0 0 80px rgba(255,23,68,0.6);
    white-space:nowrap; z-index:22;
    animation: jokerTextPop 1.4s cubic-bezier(.2,1.6,.3,1) forwards;
  }
  @keyframes jokerTextPop {
    0% { transform:translate(-50%,-50%) scale(0.1) rotate(-25deg); opacity:0; }
    20% { transform:translate(-50%,-50%) scale(1.5) rotate(10deg); opacity:1; }
    35% { transform:translate(-50%,-50%) scale(1.1) rotate(-6deg); opacity:1; }
    50% { transform:translate(-50%,-50%) scale(1.25) rotate(4deg); opacity:1; }
    70% { transform:translate(-50%,-50%) scale(1.15) rotate(-2deg); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1.2) rotate(0deg); opacity:0; }
  }
  #dangerFlash { position:fixed; inset:0; background:#b71c1c; opacity:0; pointer-events:none; z-index:21; }
  #dangerFlash.pulse { animation: dangerPulse 0.5s ease-in-out 3; }
  @keyframes dangerPulse { 0%,100%{ opacity:0; } 50%{ opacity:0.55; } }
  #darkFade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:17; transition:opacity 0.8s ease; }
  #darkFade.on { opacity:0.55; }

  .joker-card-big {
    position:fixed; left:50%; top:52%; width:52vw; max-width:320px;
    transform:translate(-50%,-50%) scale(0.1) rotate(0deg);
    z-index:23; border-radius:8%;
    box-shadow:0 0 40px rgba(255,23,68,0.85), 0 0 90px rgba(255,23,68,0.5), 0 10px 30px rgba(0,0,0,0.7);
    animation: jokerCardIn 1.6s cubic-bezier(.2,1.7,.3,1) forwards;
  }
  @keyframes jokerCardIn {
    0% { transform:translate(-50%,-50%) scale(0.05) rotate(0deg); opacity:0; }
    35% { transform:translate(-50%,-50%) scale(1.15) rotate(540deg); opacity:1; }
    55% { transform:translate(-50%,-50%) scale(0.95) rotate(700deg); opacity:1; }
    75% { transform:translate(-50%,-50%) scale(1.05) rotate(720deg); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1) rotate(720deg); opacity:1; }
  }

  /* ---------- 画面オーバーレイ ---------- */
  .screen { position:absolute; inset:0; background:rgba(10,14,30,0.92); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; z-index:10; padding:24px; }
  .hidden { display:none !important; }
  .screen h1 { font-family:'Courier New',monospace; font-size:30px; letter-spacing:3px; color:#ffd54f; text-shadow:2px 2px 0 #e65100, 0 0 18px rgba(255,213,79,0.5); margin-bottom:14px; }

  /* ---------- スタート画面の豪華フレーム ---------- */
  .lux-panel {
    position:relative;
    width:100%; max-width:420px;
    background: linear-gradient(160deg, #10234f 0%, #0b1733 100%);
    border:3px solid #d4af37;
    border-radius:18px;
    padding:34px 26px 30px;
    box-shadow:
      0 0 0 6px rgba(212,175,55,0.15),
      0 0 40px rgba(0,0,0,0.6),
      inset 0 0 30px rgba(212,175,55,0.12);
  }
  .lux-panel::before {
    content:'';
    position:absolute; inset:9px;
    border:1.5px solid rgba(212,175,55,0.55);
    border-radius:12px;
    pointer-events:none;
  }
  .lux-corner { position:absolute; width:34px; height:34px; }
  .lux-corner::before, .lux-corner::after {
    content:''; position:absolute; background:#d4af37;
  }
  .lux-corner::before { width:100%; height:3px; top:0; }
  .lux-corner::after { width:3px; height:100%; left:0; }
  .lux-corner.tl { top:6px; left:6px; }
  .lux-corner.tr { top:6px; right:6px; transform:scaleX(-1); }
  .lux-corner.bl { bottom:6px; left:6px; transform:scaleY(-1); }
  .lux-corner.br { bottom:6px; right:6px; transform:scale(-1,-1); }

  .lux-panel h1 {
    position:relative; overflow:hidden;
    background: linear-gradient(100deg, #b8860b 0%, #fff6cf 20%, #ffd54f 40%, #b8860b 60%, #fff6cf 80%, #ffd54f 100%);
    background-size:250% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:none;
    filter:drop-shadow(2px 2px 0 #3a1e00) drop-shadow(0 0 16px rgba(255,213,79,0.5));
    animation: shineSweep 3.5s linear infinite;
  }
  @keyframes shineSweep { 0%{ background-position:0% center; } 100%{ background-position:-250% center; } }

  .lux-divider { width:70%; margin:6px auto 16px; height:2px; position:relative;
    background:linear-gradient(90deg, transparent, #d4af37, transparent); }
  .lux-divider::before { content:'✦'; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:#ffd54f; font-size:16px; background:#0b1733; padding:0 8px; }

  .lux-btn {
    position:relative; overflow:hidden;
    background:linear-gradient(180deg, #ffe082, #ffb300 55%, #e08600);
    border:2px solid #a86a00;
    color:#3a2400;
    text-shadow:0 1px 0 rgba(255,255,255,0.4);
    box-shadow:0 4px 0 #8a5500, 0 6px 14px rgba(0,0,0,0.5);
  }
  .lux-btn::after {
    content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.65), transparent);
    animation: btnShine 2.6s ease-in-out infinite;
  }
  @keyframes btnShine { 0%{ left:-60%; } 60%{ left:130%; } 100%{ left:130%; } }
  .lux-btn:active { transform:translateY(3px); box-shadow:0 1px 0 #8a5500, 0 3px 8px rgba(0,0,0,0.5); }
  .screen p { font-size:15px; margin-bottom:8px; line-height:1.7; color:#e0e0e0; }
  .btn { margin-top:18px; padding:14px 34px; font-size:17px; font-weight:bold; border:none; border-radius:8px; background:#ffb300; color:#333; }
  .janken-btn { margin-top:0; padding:14px 16px; font-size:26px; border-radius:50%; width:80px; height:80px; display:flex; align-items:center; justify-content:center; flex-direction:column; font-size:13px; }
  .janken-btn.disabled { opacity:0.4; pointer-events:none; }
  .janken-in h1 { animation: jankenTitleIn 0.6s cubic-bezier(.2,1.6,.3,1); }
  @keyframes jankenTitleIn { 0%{ transform:scale(0.2) rotate(-20deg); opacity:0; } 60%{ transform:scale(1.2) rotate(6deg); opacity:1; } 100%{ transform:scale(1) rotate(0deg); opacity:1; } }
  .btn:active { background:#ff9800; }

  #confettiLayer { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:15; }
  .confetti-piece { position:absolute; top:-20px; border-radius:2px; animation-name:confettiFall; animation-timing-function:linear; animation-fill-mode:forwards; }
  @keyframes confettiFall { 0%{transform:translateY(0) rotate(0deg); opacity:1;} 100%{transform:translateY(110vh) rotate(600deg); opacity:0.9;} }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div><span class="label">ステージ</span><span id="stageLabel">1 / 4</span></div>
    <div><span class="label">残り</span><span id="missLabel">❤️❤️❤️</span></div>
    <div><span class="label">めくった回数</span><span id="movesLabel">0</span></div>
    <div><span class="label">スコア</span><span id="scoreLabel">0</span></div>
  </div>

  <div id="boardDim"></div>
  <div id="boardWrap">
    <div id="board"></div>
  </div>

  <div class="screen" id="startScreen">
    <div class="lux-panel">
      <div class="lux-corner tl"></div>
      <div class="lux-corner tr"></div>
      <div class="lux-corner bl"></div>
      <div class="lux-corner br"></div>
      <h1>関根商店<br>神経衰弱</h1>
      <div class="lux-divider"></div>
      <p>社員さん30人のカードで神経衰弱!<br>ランダムに8人ずつ登場、全ステージクリアを目指そう。</p>
      <button class="btn lux-btn" id="startBtn">▶ スタート</button>
    </div>
  </div>

  <div class="screen hidden" id="clearScreen">
    <h1 id="clearTitle">ステージクリア!</h1>
    <p id="clearInfo"></p>
    <button class="btn" id="nextBtn">つぎへ</button>
  </div>

  <div class="screen hidden" id="allClearScreen">
    <h1>🎉 全員クリア! 🎉</h1>
    <p id="allClearInfo"></p>
    <button class="btn" id="restartBtn">もういちど</button>
  </div>

  <div class="screen hidden" id="gameOverScreen" style="background:rgba(20,10,10,0.94);">
    <h1 id="gameOverTitle" style="color:#ff8a80; text-shadow:2px 2px 0 #4a0000, 0 0 18px rgba(255,138,128,0.6);">😭 残念!!!!!!</h1>
    <p id="gameOverReason">ジョーカーを引いてしまった…</p>
    <p id="gameOverInfo"></p>
    <button class="btn" id="retryJokerBtn">もういちど</button>
  </div>

  <div id="dangerFlash"></div>
  <div id="darkFade"></div>
  <div id="matchFlash"></div>
  <div id="luckyLayer"></div>

  <div class="screen hidden" id="jankenScreen" style="background:rgba(10,14,30,0.94); z-index:25;">
    <h1 style="font-size:26px;">⚔️ いざ勝負!! ⚔️</h1>
    <p>純子とじゃんけん!勝てばボーナス、負けたらハートが1つ減るよ</p>
    <div id="jankenHands" style="display:flex; gap:16px; margin-top:10px;">
      <button class="btn janken-btn" data-hand="rock">✊ グー</button>
      <button class="btn janken-btn" data-hand="scissors">✌️ チョキ</button>
      <button class="btn janken-btn" data-hand="paper">✋ パー</button>
    </div>
    <div id="jankenResult" style="margin-top:18px; font-size:20px; font-weight:bold; min-height:60px;"></div>
  </div>
  <div id="confettiLayer"></div>

    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  let stageGroups = [];
  let stageIndex = 0;
  let score = 0;
  let moves = 0;
  let missCount = 0;
  const MAX_MISSES = 3;
  let matchedCount = 0;
  let stageTotal = 0;
  let flippedSlots = [];
  let shachoChoiceActive = null;
  let locked = false;

  const boardEl = document.getElementById('board');
  const stageLabel = document.getElementById('stageLabel');
  const movesLabel = document.getElementById('movesLabel');
  const scoreLabel = document.getElementById('scoreLabel');
  const missLabel = document.getElementById('missLabel');

  function updateTopbar(){
    stageLabel.textContent = (stageIndex+1) + ' / ' + GROUP_SIZES.length;
    movesLabel.textContent = moves;
    scoreLabel.textContent = score;
    if(missLabel){
      let hearts = '';
      for(let i=0;i<MAX_MISSES;i++){ hearts += (i < MAX_MISSES-missCount) ? '❤️' : '🖤'; }
      missLabel.textContent = hearts;
    }
  }

  function showScreen(id){
    ['startScreen','clearScreen','allClearScreen','gameOverScreen'].forEach(s=>{
      document.getElementById(s).classList.toggle('hidden', s!==id);
    });
  }
  function hideAllScreens(){
    ['startScreen','clearScreen','allClearScreen','gameOverScreen'].forEach(s=>{
      document.getElementById(s).classList.add('hidden');
    });
  }

  function newGame(){
    const shuffledEmployees = shuffle(EMP_KEYS);
    stageGroups = [];
    let idx = 0;
    for(const size of GROUP_SIZES){
      stageGroups.push(shuffledEmployees.slice(idx, idx+size));
      idx += size;
    }
    stageIndex = 0;
    score = 0;
    moves = 0;
    missCount = 0;
    loadStage();
  }

  function loadStage(){
    const group = stageGroups[stageIndex];
    stageTotal = group.length;
    matchedCount = 0;
    missCount = 0;
    flippedSlots = [];
    locked = false;

    let deck = [];
    group.forEach(key=>{ deck.push(key); deck.push(key); });
    deck = shuffle(deck);

    boardEl.innerHTML = '';
    const cols = deck.length <= 12 ? 4 : 4;
    boardEl.style.gridTemplateColumns = 'repeat('+cols+', 1fr)';

    deck.forEach((key, i)=>{
      const slot = document.createElement('div');
      slot.className = 'cardSlot';
      slot.dataset.key = key;
      slot.dataset.matched = 'false';
      slot.innerHTML =
        '<div class="cardInner">' +
          '<div class="cardFace cardBack"><img src="'+b64src('card_back')+'"></div>' +
          '<div class="cardFace cardFront"><img src="'+b64src(key)+'"></div>' +
        '</div>';
      slot.addEventListener('click', ()=>onCardClick(slot));
      boardEl.appendChild(slot);
    });

    updateTopbar();
    hideAllScreens();
  }

  const INSTANT_SPECIAL_KEYS = ['card_shacho','card_joumu','card_sengoku','card_junko'];

  function onCardClick(slot){
    if(shachoChoiceActive){
      if(shachoChoiceActive.options.includes(slot)){
        const chosen = slot;
        const cb = shachoChoiceActive.onPick;
        shachoChoiceActive = null;
        cb(chosen);
      }
      return;
    }
    if(locked) return;
    if(slot.classList.contains('flipped')) return;
    if(slot.dataset.matched === 'true') return;
    if(flippedSlots.length >= 2) return;

    slot.classList.add('flipped');
    const key = slot.dataset.key;

    if(key === 'joker_card'){
      locked = true;
      setTimeout(onJokerHit, 750);
      return;
    }

    if(INSTANT_SPECIAL_KEYS.includes(key)){
      // 進行中の未確定カードがあれば裏返しておく
      if(flippedSlots.length === 1){
        flippedSlots[0].classList.remove('flipped');
        flippedSlots = [];
      }
      locked = true;
      moves++;
      updateTopbar();
      setTimeout(()=> triggerInstantSpecial(slot, key), 550);
      return;
    }

    flippedSlots.push(slot);

    if(flippedSlots.length === 2){
      moves++;
      updateTopbar();
      locked = true;
      const [a,b] = flippedSlots;
      if(a.dataset.key === b.dataset.key){
        setTimeout(()=>{
          a.dataset.matched = 'true'; b.dataset.matched = 'true';
          a.classList.add('matched'); b.classList.add('matched');
          matchedCount++;
          score += 10;
          updateTopbar();
          celebrateMatch(a, b);
          setTimeout(()=>{ a.classList.add('gone'); b.classList.add('gone'); }, 700);
          flippedSlots = [];
          locked = false;
          checkStageClear();
        }, 500);
      } else {
        missCount++;
        updateTopbar();
        setTimeout(()=>{
          a.classList.remove('flipped'); b.classList.remove('flipped');
          flippedSlots = [];
          locked = false;
          if(missCount >= MAX_MISSES){
            onMissLimitReached();
          }
        }, 900);
      }
    }
  }

  function triggerInstantSpecial(slot, key){
    const twin = Array.from(boardEl.querySelectorAll('.cardSlot')).find(s=>
      s!==slot && s.dataset.key===key && s.dataset.matched!=='true' && !s.classList.contains('gone')
    );
    if(twin) twin.classList.add('flipped');

    function finishMatch(){
      slot.dataset.matched = 'true';
      slot.classList.add('matched');
      if(twin){ twin.dataset.matched = 'true'; twin.classList.add('matched'); }
      matchedCount++;
    }
    function cleanupGone(){
      setTimeout(()=>{ slot.classList.add('gone'); if(twin) twin.classList.add('gone'); }, 700);
    }
    const pairForFx = [slot, twin || slot];

    if(key === 'card_shacho'){
      finishMatch();
      score += 60;
      if(missCount > 0) missCount--;
      updateTopbar();
      celebrateLuckyChance(pairForFx[0], pairForFx[1]);
      cleanupGone();
      setTimeout(()=>{
        startCardChoiceBonus(2, {
          promptText: '✨ 社長のラッキーチャンス!どちらか1枚選んでね ✨',
          pickScore: 20
        });
      }, 900);
    } else if(key === 'card_joumu'){
      finishMatch();
      score += 10;
      updateTopbar();
      celebrateMatch(pairForFx[0], pairForFx[1]);
      spinCards(twin ? [slot,twin] : [slot]);
      announceSpecial('常務パワー!!回転タイム!!');
      setTimeout(()=>{ slot.classList.add('gone'); if(twin) twin.classList.add('gone'); }, 950);
      setTimeout(()=>{
        startCardChoiceBonus(4, {
          promptText: '常務パワー!4枚から1枚選んでね!',
          pickScore: 20
        });
      }, 1050);
    } else if(key === 'card_sengoku'){
      finishMatch();
      score += 10;
      updateTopbar();
      celebrateMatch(pairForFx[0], pairForFx[1]);
      spinCards(twin ? [slot,twin] : [slot]);
      shuffleRemainingCards();
      announceSpecial('仙石シャッフル!!かき混ぜます!!');
      setTimeout(()=>{ slot.classList.add('gone'); if(twin) twin.classList.add('gone'); }, 950);
      setTimeout(()=>{
        startCardChoiceBonus(8, {
          promptText: '仙石シャッフル!8枚から1枚選んでね!',
          pickScore: 20
        });
      }, 1150);
    } else if(key === 'card_junko'){
      finishMatch();
      score += 10;
      updateTopbar();
      celebrateMatch(pairForFx[0], pairForFx[1]);
      cleanupGone();
      setTimeout(startJankenBattle, 900);
    }
  }

  // ---------- 音 ----------
  let audioCtx = null;
  function unlockAudio(){
    if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, vol, delay){
    if(!audioCtx) return;
    setTimeout(()=>{
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = vol!==undefined?vol:0.16;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    }, delay||0);
  }
  function playLuckyFanfare(){
    [660,880,1047,1319].forEach((f,i)=>beep(f, 0.22, 'square', 0.18, i*70));
  }

  function spawnSparkleBurst(x, y){
    const layer = document.getElementById('confettiLayer');

    for(let i=0;i<26;i++){
      const s = document.createElement('div');
      s.className = 'sparkle-burst';
      const angle = (Math.PI*2/18)*i + Math.random()*0.3;
      const dist = 60 + Math.random()*90;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist;
      s.style.left = x+'px';
      s.style.top = y+'px';
      s.style.background = colors[Math.floor(Math.random()*colors.length)];
      s.style.borderRadius = '50%';
      s.style.transition = 'transform 0.7s cubic-bezier(.2,.8,.3,1), opacity 0.7s ease-out';
      layer.appendChild(s);
      requestAnimationFrame(()=>{
        s.style.transform = `translate(${dx}px, ${dy}px) scale(0.2)`;
        s.style.opacity = '0';
      });

    }

  function shuffleRemainingCards(){
    const remaining = Array.from(boardEl.querySelectorAll('.cardSlot')).filter(s=>
      !s.classList.contains('flipped') && s.dataset.matched !== 'true' && !s.classList.contains('gone')
    );
    if(remaining.length < 2) return;
    const keys = remaining.map(s=>s.dataset.key);
    const shuffledKeys = shuffle(keys);
    remaining.forEach(s=> s.classList.add('shuffle-wiggle'));
    setTimeout(()=>{
      remaining.forEach((s,i)=>{
        s.dataset.key = shuffledKeys[i];
        const img = s.querySelector('.cardFront img');
        if(img) img.src = b64src(shuffledKeys[i]);
        s.classList.remove('shuffle-wiggle');
      });
    }, 450);
  }

  // n枚の裏向きカードから1枚選ばせて自動でペアを揃えるボーナス演出
  function startCardChoiceBonus(n, opts){
    opts = opts || {};
    const promptText = opts.promptText || (n+'枚から1枚選んでね!');
    const pickScore = opts.pickScore !== undefined ? opts.pickScore : 20;
    const onComplete = opts.onComplete || function(){ locked = false; checkStageClear(); };

    const candidates = Array.from(boardEl.querySelectorAll('.cardSlot')).filter(s=>
      !s.classList.contains('flipped') && s.dataset.matched !== 'true' && !s.classList.contains('gone')
    );
    if(candidates.length < 2){ onComplete(); return; }

    const count = Math.min(n, candidates.length);
    const options = shuffle(candidates).slice(0, count);
    options.forEach(s=> s.classList.add('choice-glow'));
    showChoicePrompt(promptText);

    shachoChoiceActive = {
      options,
      onPick: function(chosen){
        options.forEach(s=> s.classList.remove('choice-glow'));
        hideChoicePrompt();

        const twin = Array.from(boardEl.querySelectorAll('.cardSlot')).find(s=>
          s!==chosen && s.dataset.key===chosen.dataset.key && s.dataset.matched!=='true' && !s.classList.contains('gone')
        );
        if(twin){
          chosen.classList.add('flipped'); twin.classList.add('flipped');
          setTimeout(()=>{
            chosen.dataset.matched='true'; twin.dataset.matched='true';
            chosen.classList.add('matched'); twin.classList.add('matched');
            matchedCount++;
            score += pickScore;
            updateTopbar();
            celebrateMatch(chosen, twin);
            setTimeout(()=>{ chosen.classList.add('gone'); twin.classList.add('gone'); }, 700);
            setTimeout(onComplete, 750);
          }, 500);
        } else {
          onComplete();
        }
      }
    };
  }

  const HAND_EMOJI = {rock:'✊', scissors:'✌️', paper:'✋'};

  function judgeJanken(player, cpu){
    if(player === cpu) return 'draw';
    if((player==='rock' && cpu==='scissors') ||
       (player==='scissors' && cpu==='paper') ||
       (player==='paper' && cpu==='rock')) return 'win';
    return 'lose';
  }

  function startJankenBattle(){

    document.querySelectorAll('.janken-btn').forEach(b=> b.classList.remove('disabled'));
    const scr = document.getElementById('jankenScreen');
    scr.classList.remove('hidden');
    scr.classList.remove('janken-in'); void scr.offsetWidth; scr.classList.add('janken-in');

  function onJankenPick(hand){
    document.querySelectorAll('.janken-btn').forEach(b=> b.classList.add('disabled'));
    const hands = ['rock','scissors','paper'];
    const cpu = hands[Math.floor(Math.random()*3)];
    const result = judgeJanken(hand, cpu);
    const resultEl = document.getElementById('jankenResult');
    let msg = 'あなた:'+HAND_EMOJI[hand]+'　純子:'+HAND_EMOJI[cpu]+'<br>';

    if(result === 'win'){
      msg += '🎉 かち!! ラッキーの2択が出るよ!';
      playLuckyFanfare();
    } else if(result === 'lose'){
      msg += '😭 まけ…まさかのゲームオーバー…';
      playSadSound();
    } else {
      msg += 'あいこ!もう一回!';
    }
    resultEl.innerHTML = msg;

    if(result === 'draw'){
      setTimeout(()=>{
        document.querySelectorAll('.janken-btn').forEach(b=> b.classList.remove('disabled'));
        resultEl.innerHTML = '';
      }, 1100);
      return;
    }

    if(result === 'win'){
      setTimeout(()=>{
        document.getElementById('jankenScreen').classList.add('hidden');
        startCardChoiceBonus(2, {
          promptText: '✨ じゃんけん勝利!ラッキーの2択! ✨',
          pickScore: 20
        });
      }, 1500);
    } else {
      setTimeout(()=>{
        document.getElementById('jankenScreen').classList.add('hidden');
        onJankenLose();
      }, 1500);
    }
  }

      showScreen('allClearScreen');
    } else {
      document.getElementById('clearTitle').textContent = 'ステージ'+(stageIndex+1)+' クリア!';
      document.getElementById('clearInfo').textContent = 'スコア: '+score+' / めくった回数: '+moves;
      showScreen('clearScreen');
    }
  }

  document.getElementById('startBtn').addEventListener('click', ()=>{
    unlockAudio();
    newGame();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    stageIndex++;
    loadStage();
  });
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    newGame();
  });
  document.getElementById('retryJokerBtn').addEventListener('click', ()=>{
    newGame();
  });

})();
</script>
</body>
</html>
